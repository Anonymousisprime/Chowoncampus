<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student sign up | Chowoncampus</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#163426;background:#f2f8f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:white;border:1px solid #dce9df;border-radius:22px;padding:28px;box-shadow:0 18px 50px #153d2710}a{color:#176b45}h1{margin:8px 0;font-size:28px}.muted{color:#64766a;line-height:1.5}.brand{font-weight:900;color:#176b45;text-decoration:none;font-size:20px}label{display:block;font-weight:650;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd9cf;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;background:#176b45;color:white;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:750;cursor:pointer}button:disabled{opacity:.6}.msg{margin-top:14px;line-height:1.5}.hidden{display:none}.foot{margin-top:20px;font-size:14px}
</style></head><body><main class="card"><a class="brand" href="/">Chowoncampus</a><h1>Create your student account</h1><p class="muted">Create an account with your name, phone number and password. SMS verification will be added later, so your phone is not marked verified yet.</p>
<form id="signup"><label for="name">Full name</label><input id="name" autocomplete="name" required minlength="2" maxlength="100"><label for="phone">Phone number</label><input id="phone" placeholder="+2348012345678" autocomplete="tel" required><p class="muted">Use international format, including +234 for Nigerian numbers.</p><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required><button id="send" type="submit">Create account</button></form><p id="msg" class="msg" role="status"></p><div class="foot">Already registered? <a href="/student-login.html">Student login</a></div></main>
<script>
$("#signup").addEventListener("submit",async e=>{e.preventDefault();$("#msg").textContent="Creating account…";$("#send").disabled=true;try{const d=await call("/api/student/register",{name:$("#name").value.trim(),phone:$("#phone").value.trim(),password:$("#password").value});$("#msg").textContent=d.message+" Redirecting…";location.href="/"}catch(err){$("#msg").textContent=err.message}finally{$("#send").disabled=false}});
async function call(url,body){const r=await fetch(url,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}
</script></body></html>
