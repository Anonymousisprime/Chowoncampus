<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b45"><title>Delivery agent login | Chowoncampus</title>
<style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#163426;background:#f3f7f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#fff;border:1px solid #dfe9e1;border-radius:22px;padding:28px;box-shadow:0 18px 50px #153d2710}.brand{font-size:20px;font-weight:900;color:#176b45;text-decoration:none}.muted{color:#687a6e;line-height:1.55}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #cfddd2;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;background:#176b45;color:white;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:750;cursor:pointer}.msg{margin-top:14px;line-height:1.5}</style></head>
<body><main class="card"><a class="brand" href="/">Chowoncampus</a><h1>Delivery agent login</h1><p class="muted">Agent accounts are created by the Chowoncampus administrator. If you need access, contact the admin.</p><form id="login"><label for="username">Username</label><input id="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p id="msg" class="msg" role="status"></p><p>Need help? <a href="/support.html">Support page</a> · <a href="mailto:chowoncampus@gmail.com">Email support</a> · <a href="tel:+2349169398221">09169398221</a></p><p><a href="/">Return to Chowoncampus</a></p></main>
<script>document.querySelector("#login").addEventListener("submit",async e=>{e.preventDefault();const msg=document.querySelector("#msg");msg.textContent="Signing in…";try{const r=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.querySelector("#username").value.trim(),password:document.querySelector("#password").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Login failed.");if(d.account?.role!=="agent"){await fetch("/api/logout",{method:"POST",credentials:"same-origin"});throw Error("This login is for delivery-agent accounts only.");}location.href="/agent-dashboard.html";}catch(err){msg.textContent=err.message||"Could not sign in. Please try again.";}});</script></body></html>
