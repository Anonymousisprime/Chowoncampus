<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Other Businesses Admin | ChowOnCampus</title><style>body{font-family:Inter,system-ui,sans-serif;background:#f3f7f4;color:#163426;margin:0}.top{background:#fff;padding:16px 5%;border-bottom:1px solid #dfe9e1}.brand{color:#176b45;font-weight:900;text-decoration:none}.wrap{max-width:1050px;margin:25px auto;padding:0 16px}.card{background:#fff;border:1px solid #dfe9e1;border-radius:14px;padding:18px;margin:14px 0}.muted{color:#687a6e}.btn{border:0;border-radius:8px;padding:9px 12px;background:#176b45;color:#fff;font-weight:700;cursor:pointer;margin:4px}.danger{background:#a12c2c}.status{min-height:22px}</style></head><body><header class="top"><a class="brand" href="/admin-dashboard.html">ChowOnCampus · Ultimate Admin</a></header><main class="wrap"><h1>Other Businesses</h1><p class="muted">Review campus shop applications and control approval. Do not approve a merchant until identity, business and settlement documents have been independently checked.</p><p id="status" class="status"></p><section id="items"></section></main><script>
async function load(){const root=document.querySelector("#items"),status=document.querySelector("#status");try{const r=await fetch("/api/admin/other-businesses",{cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.error||"Admin access required");root.innerHTML="";if(!d.businesses.length){root.textContent="No business applications yet.";return;}for(const b of d.businesses){const c=document.createElement("article");c.className="card";const h=document.createElement("h2");h.textContent=b.name+" · "+b.status;const p=document.createElement("p");p.textContent=b.category+" | "+b.ownerName+" | "+b.phone+" | "+b.location;const meta=document.createElement("p");meta.className="muted";meta.textContent="Username: "+b.username+" · Products: "+b.productCount+" · Settlement configured: "+(b.settlementConfigured?"Yes":"No")+" · Submitted: "+new Date(b.createdAt).toLocaleString();c.append(h,p,meta);for(const [action,label,cl] of [["approve","Approve",""],["reject","Reject","danger"],["suspend","Suspend","danger"],["restore","Restore",""]]){const btn=document.createElement("button");btn.className="btn "+cl;btn.textContent=label;btn.onclick=async()=>{let reason="";if(["reject","suspend"].includes(action)){reason=prompt("Reason (required):")||"";if(!reason.trim())return;}try{const rr=await fetch("/api/admin/other-businesses/"+encodeURIComponent(b.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,reason})});const out=await rr.json();if(!rr.ok)throw Error(out.error||"Action failed");status.textContent=out.message;load();}catch(e){status.textContent=e.message}};c.append(btn);}root.append(c);}}catch(e){status.textContent=e.message;}}
load();
</script></body></html>
