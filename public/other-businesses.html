<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b45"><title>Shop Campus | ChowOnCampus</title><link rel="stylesheet" href="/style.css"><style>
body{margin:0;background:#f3f7f4;color:#163426;font-family:Inter,system-ui,sans-serif}.top{background:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dfe9e1}.brand{font-weight:900;color:#176b45;text-decoration:none;font-size:20px}.wrap{max-width:1120px;margin:28px auto;padding:0 18px 60px}.hero{background:linear-gradient(130deg,#103d2c,#176b45);color:#fff;border-radius:20px;padding:28px}.hero p{color:#e1f1e6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:22px}.shop,.product{background:white;border:1px solid #dfe9e1;border-radius:15px;padding:17px}.shop h2{margin:5px 0}.tag{color:#176b45;font-size:12px;font-weight:800;text-transform:uppercase}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.product img{width:100%;height:130px;object-fit:cover;border-radius:10px;background:#edf4ef}.muted{color:#687a6e}.status{padding:12px 0}.btn{border:0;border-radius:9px;padding:10px 14px;background:#176b45;color:#fff;font-weight:750;cursor:pointer}a{color:#176b45}@media(max-width:560px){.top{padding:12px}.hero{padding:20px}}
</style></head><body><header class="top"><a class="brand" href="/">ChowOnCampus</a><div><a href="/student-dashboard.html">Student dashboard</a> · <a href="/business-dashboard.html">Business portal</a></div></header>
<main class="wrap"><section class="hero"><span>BEYOND FOOD</span><h1>Shop campus businesses</h1><p>Discover approved supermarkets, boutiques, bookshops, electronics and general campus stores.</p></section><div class="status" id="status" role="status">Loading approved shops…</div><section id="shops" class="grid"></section></main>
<script>
const money=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(n||0);
async function load(){const status=document.querySelector("#status"),root=document.querySelector("#shops");try{const r=await fetch("/api/other-businesses",{cache:"no-store"});const d=await r.json();if(!r.ok)throw Error(d.error||"Could not load shops.");root.innerHTML="";if(!d.businesses.length){status.textContent="No approved shops are online right now. Please check again later.";return;}status.textContent=d.businesses.length+" approved businesses online";for(const b of d.businesses){const card=document.createElement("article");card.className="shop";const h=document.createElement("h2");h.textContent=b.name;const tag=document.createElement("div");tag.className="tag";tag.textContent=b.category;const desc=document.createElement("p");desc.className="muted";desc.textContent=b.description||b.location;const loc=document.createElement("p");loc.textContent="📍 "+b.location;const products=document.createElement("div");products.className="products";for(const p of b.products){const item=document.createElement("div");item.className="product";if(p.imageUrl){const img=document.createElement("img");img.src=p.imageUrl;img.alt=p.name;img.loading="lazy";item.append(img);}const name=document.createElement("strong");name.textContent=p.name;const price=document.createElement("p");price.textContent=money(p.price);const note=document.createElement("small");note.className="muted";note.textContent=p.description||p.category||"";item.append(name,price,note);products.append(item);}card.append(tag,h,desc,loc,products);root.append(card);}}catch(e){status.textContent=e.message;}}load();
</script></body></html>
