<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurant login | Chowoncampus</title>
<style>
:root{font-family:Inter,system-ui,Arial,sans-serif;color:#163426;background:#f2f8f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:#fff;border:1px solid #dce9df;border-radius:22px;padding:28px;box-shadow:0 18px 50px #153d2710}a{color:#176b45}.brand{font-weight:900;color:#176b45;text-decoration:none;font-size:20px}h1{margin:12px 0}.muted{color:#64766a;line-height:1.5}label{display:block;font-weight:650;margin:16px 0 6px}input{width:100%;padding:13px;border:1px solid #cbd9cf;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;background:#176b45;color:#fff;border:0;border-radius:10px;padding:14px;font:inherit;font-weight:750;cursor:pointer}.msg{margin-top:14px;line-height:1.5}
</style></head>
<body><main class="card"><a class="brand" href="/">Chowoncampus</a><h1>Restaurant partner login</h1><p class="muted">Sign in to manage orders for your restaurant. Restaurant accounts must be created by the Chowoncampus administrator.</p>
<form id="login"><label for="username">Restaurant username</label><input id="username" autocomplete="username" placeholder="e.g. campusbites" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p id="msg" class="msg" role="status"></p><p><a href="/restaurant-privacy.html">Restaurant Partner Privacy Policy</a> · <a href="/privacy-policy.html">General Privacy Policy</a></p><p>Need help? <a href="/support.html">Support page</a> · <a href="mailto:chowoncampus@gmail.com">Email support</a> · <a href="tel:+2349131999590">09131999590</a></p><p><a href="/">Return to Chowoncampus</a></p></main>
<script>
document.querySelector("#login").addEventListener("submit",async e=>{e.preventDefault();const msg=document.querySelector("#msg");msg.textContent="Signing in…";try{const response=await fetch("/api/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.querySelector("#username").value.trim(),password:document.querySelector("#password").value})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Login failed.");if(data.account?.role!=="restaurant"){await fetch("/api/logout",{method:"POST",credentials:"same-origin"});throw new Error("This login is for restaurant accounts only.");}window.location.href="/restaurant-dashboard.html?dashboard=1";}catch(error){msg.textContent=error.message||"Could not sign in. Please try again.";}}
);
</script></body></html>
